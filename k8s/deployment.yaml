apiVersion: apps/v1
kind: Deployment
metadata:
  name: precedentia-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: docker.io/gabguimaraes/precedentia-api:6eb4d70
        ports:
        - containerPort: 5000
        resources:
          limits:
            memory: "4Gi"
            cpu: "1000m"
